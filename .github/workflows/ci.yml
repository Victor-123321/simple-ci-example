name: Simple CI
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Install
        run: npm install
      - name: Test
        run: npm test
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: victorvelazquez-pipeline-app
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
